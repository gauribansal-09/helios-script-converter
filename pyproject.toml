[project]
name = "helios-converter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk",
    "pydantic",
    "sqlglot",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helios_converter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
